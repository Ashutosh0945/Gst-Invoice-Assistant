version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gst
      POSTGRES_PASSWORD: gst
      POSTGRES_DB: gst
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gst"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: { context: ., dockerfile: Dockerfile }
    depends_on: { db: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgresql+psycopg2://gst:gst@db:5432/gst
      API_URL: http://api:8000
      LLM_ENABLED: "true"
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      EINVOICE_PUBLIC_KEY_PATHS: ${EINVOICE_PUBLIC_KEY_PATHS:-}
      ITC_SAME_LINE_PREFIXES: ${ITC_SAME_LINE_PREFIXES:-}
      SESSION_SECRET: ${SESSION_SECRET:-change-me-in-production}
      ASSISTANT_MODEL: ${ASSISTANT_MODEL:-openai/gpt-4o-mini}
    ports: ["8000:8000"]
    volumes: ["./data:/srv/data"]
    command: >
      sh -c "python scripts/init_db.py && uvicorn backend.api.main:app --host 0.0.0.0 --port 8000"

  web:
    build: { context: ., dockerfile: Dockerfile.web }
    depends_on: [api]
    environment:
      BACKEND_URL: http://api:8000
    ports: ["3000:3000"]
    # Brand settings are baked in at build time; set them in .env before `docker compose build`.

  worker:
    build: { context: ., dockerfile: Dockerfile.ml }
    depends_on: { db: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgresql+psycopg2://gst:gst@db:5432/gst
      LLM_ENABLED: "true"
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    volumes: ["./data:/srv/data"]
    command: ["python", "-m", "backend.etl.orchestration"]

volumes:
  pgdata:
